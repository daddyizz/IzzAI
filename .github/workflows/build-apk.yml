name: Build IzzAI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      IZZAI_KEYSTORE_PATH: ${{ github.workspace }}/izzai-test-signing.jks
      IZZAI_SIGNING_PASSWORD: ${{ secrets.IZZAI_SIGNING_PASSWORD }}
      IZZAI_KEYSTORE_B64: ${{ secrets.IZZAI_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent test signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IZZAI_SIGNING_PASSWORD" || { echo "::error::Set IZZAI_SIGNING_PASSWORD secret"; exit 1; }
          test -n "$IZZAI_KEYSTORE_B64" || { echo "::error::Set IZZAI_KEYSTORE_B64 secret"; exit 1; }
          printf '%s' "$IZZAI_KEYSTORE_B64" | base64 --decode > "$IZZAI_KEYSTORE_PATH"
          chmod 600 "$IZZAI_KEYSTORE_PATH"
          keytool -list -keystore "$IZZAI_KEYSTORE_PATH" -storepass "$IZZAI_SIGNING_PASSWORD" -alias izzai-test >/dev/null

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36"
      - name: Prepare upstream native engine
        run: bash prepare.sh
      - name: Build APK
        working-directory: android
        run: bash gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IzzAI-test-signed
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
